<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEFinder 素材库 · 简化导入样稿</title>
<style>
/* Hallmark · genre: modern-minimal · macrostructure: Workbench · design-system: design.md · designed-as-app
 * theme: MEFinder frost-blue (existing tokens) · tone: utilitarian · enrichment: none
 * pre-emit critique: P5 H5 E4 S5 R5 V4
 */
:root{
  --app-bg:#F5F8FC;--sidebar-bg:#F1F5FA;--surface-primary:#FFFFFF;--surface-secondary:#F8FAFD;--surface-elevated:#FFFFFF;
  --surface-hover:#F1F5FA;--surface-selected:#EAF3FF;--surface-sunken:#EEF2F7;
  --text-primary:#172033;--text-secondary:#414D61;--text-tertiary:#667085;--text-decorative:#98A2B3;--text-disabled:#B8C0CC;
  --border-subtle:#EDF1F6;--border-default:#DDE5EF;--border-strong:#C8D4E2;--border-control:#828CA0;
  --accent-fill:#0F62E6;--accent-hover:#0B54C9;--accent-soft:#EAF3FF;--accent-text:#0B5EC7;--accent-contrast:#FFFFFF;
  --success:#168A46;--warning:#B8620F;--warning-soft:#FFF2E2;--danger:#C8322B;--danger-soft:#FDECEA;--neutral-soft:#EEF1F5;
  --focus-ring:0 0 0 3px rgba(22,119,255,.18);
  --shadow-popover:0 12px 32px rgba(23,32,51,.13);--shadow-dialog:0 24px 64px rgba(23,32,51,.22);--dialog-backdrop:rgba(23,32,51,.32);
  --radius-xs:4px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-pill:999px;
  --font-ui:"PingFang SC","Microsoft YaHei UI","Segoe UI Variable",-apple-system,system-ui,sans-serif;
  --font-reading:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --z-dropdown:100;--z-modal:400;--z-toast:500;
}
html[data-theme="dark"]{
  --app-bg:#0F141C;--sidebar-bg:#131A24;--surface-primary:#161E29;--surface-secondary:#1A232F;--surface-elevated:#1D2733;
  --surface-hover:#1F2937;--surface-selected:#1B2C45;--surface-sunken:#121923;
  --text-primary:#E7ECF3;--text-secondary:#BAC4D2;--text-tertiary:#8E99AA;--text-decorative:#667085;--text-disabled:#5B6675;
  --border-subtle:#222C39;--border-default:#2C3847;--border-strong:#3A4757;--border-control:#6B7688;
  --accent-fill:#5B9BFF;--accent-hover:#79AEFF;--accent-soft:#1A2C47;--accent-text:#8FBBFF;--accent-contrast:#0B1422;
  --success:#4CC27E;--warning:#F0A04B;--warning-soft:#2E2215;--danger:#FF7A72;--danger-soft:#33191A;--neutral-soft:#222A36;
  --focus-ring:0 0 0 3px rgba(91,155,255,.22);
  --shadow-popover:0 16px 40px rgba(0,0,0,.5);--shadow-dialog:0 28px 80px rgba(0,0,0,.6);--dialog-backdrop:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
body{margin:0;background:var(--app-bg);color:var(--text-primary);font-family:var(--font-ui);font-size:14px;line-height:1.55;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
[hidden]{display:none!important}
mark{background:var(--surface-selected);color:var(--accent-text);padding:0 2px;border-radius:3px}

/* demo bar */
.demo{display:flex;align-items:center;align-content:flex-start;gap:8px 14px;flex-wrap:wrap;flex:0 0 auto;font-size:12.5px;color:var(--text-tertiary);min-height:30px}
.demo b{color:var(--text-secondary);font-weight:600}
.demo .spacer{flex:1}
.demo label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);white-space:nowrap}
.demo input[type=checkbox]{accent-color:var(--accent-fill)}
.seg{display:inline-flex;border:1px solid var(--border-default);border-radius:var(--radius-md);padding:2px;background:var(--surface-primary)}
.seg button{height:26px;padding:0 10px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-tertiary);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-selected);color:var(--accent-text);font-weight:600}
.link-btn{font-size:12px;color:var(--text-secondary);height:28px;padding:0 8px;border-radius:var(--radius-sm)}
.link-btn:hover{background:var(--surface-hover);color:var(--text-primary)}

/* shell */
.win{position:relative;flex:1;min-height:720px;display:grid;grid-template-columns:180px minmax(0,1fr);border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-primary)}
.side{background:var(--sidebar-bg);border-right:1px solid var(--border-subtle);padding:16px 10px 12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:7px;padding:6px 10px 16px;font-size:14px;font-weight:700;color:var(--text-primary);white-space:nowrap}
.brand svg{width:19px;height:19px;color:var(--text-tertiary);flex:0 0 auto}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:0 10px;height:38px;border-radius:var(--radius-md);font-size:14px;color:var(--text-secondary);white-space:nowrap;text-align:left;width:100%}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;color:var(--text-tertiary)}
.nav-item[aria-current="page"]{background:var(--surface-selected);color:var(--accent-text);font-weight:600}
.nav-item[aria-current="page"] svg{color:var(--accent-text)}
.nav-count{margin-left:auto;font-size:11px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.side-foot{font-size:11px;color:var(--text-decorative);padding:10px 10px 0;white-space:nowrap}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--surface-primary)}
.page-head{padding:20px 24px 0;flex:0 0 auto;display:flex;align-items:flex-start;gap:16px;min-width:0}
.page-head .head-text{flex:1;min-width:0}
.page-title{font-size:23px;font-weight:700;line-height:1.3;margin:0;overflow-wrap:anywhere}
.page-subtitle{font-size:13px;color:var(--text-tertiary);margin-top:4px}
.head-actions{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding-top:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--radius-md);font-size:13px;font-weight:500;border:1px solid var(--border-default);background:var(--surface-primary);color:var(--text-primary);white-space:nowrap;transition:background 140ms var(--ease-out),transform 100ms var(--ease-out)}
.btn:hover{background:var(--surface-hover)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-fill);color:var(--accent-contrast);border-color:var(--accent-fill)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-secondary)}
.btn.ghost:hover{background:var(--surface-hover);color:var(--text-primary)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.danger:hover{background:var(--danger-soft)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.icon-btn{width:32px;height:32px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;color:var(--text-tertiary)}
.icon-btn:hover{background:var(--surface-hover);color:var(--text-primary)}
.icon-btn svg{width:16px;height:16px}
.text-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 7px;border-radius:var(--radius-sm);font-size:12.5px;color:var(--text-secondary);white-space:nowrap}
.text-btn:hover{background:var(--surface-hover);color:var(--text-primary)}
.text-btn svg{width:14px;height:14px}

/* materials layout */
.lib-layout{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) 340px;margin-top:16px;border-top:1px solid var(--border-subtle)}
.tag-pane{min-height:0;display:flex;flex-direction:column;background:var(--surface-secondary);border-right:1px solid var(--border-subtle)}
.tag-head{height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px;font-size:12px;font-weight:600;color:var(--text-tertiary)}
.tag-head .icon-btn{width:26px;height:26px}
.tag-head .icon-btn svg{width:14px;height:14px}
.tag-list{flex:1;min-height:0;overflow:auto;padding:2px 8px 12px}
.tag-row{display:flex;align-items:center;gap:4px;height:32px;padding-right:8px;border-radius:var(--radius-md);color:var(--text-secondary);font-size:13px;cursor:pointer}
.tag-row:hover{background:var(--surface-hover);color:var(--text-primary)}
.tag-row.active{background:var(--surface-selected);color:var(--accent-text);font-weight:600}
.tag-toggle{width:18px;height:22px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;color:var(--text-tertiary);border-radius:var(--radius-sm)}
.tag-toggle:hover{background:var(--surface-hover);color:var(--text-primary)}
.tag-toggle svg{width:12px;height:12px;transition:transform 140ms var(--ease-out)}
.tag-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.tag-toggle-space{width:18px;flex:0 0 auto}
.tag-label{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tag-count{font-size:11px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;flex:0 0 auto}
.tag-row.active .tag-count{color:var(--accent-text)}

.list-pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.list-head{flex:0 0 auto;padding:12px 18px 10px;border-bottom:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:9px}
.list-head-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.list-title{font-size:15px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-count{font-size:12px;color:var(--text-tertiary);white-space:nowrap}
.list-head-top .spacer{flex:1}
.list-head-bottom{display:flex;align-items:center;gap:10px;min-width:0}
.tabs{display:inline-flex;border:1px solid var(--border-default);border-radius:var(--radius-md);padding:2px;background:var(--surface-primary);flex:0 0 auto}
.tabs button{height:26px;padding:0 10px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-tertiary);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface-selected);color:var(--accent-text);font-weight:600}
.search{flex:1;min-width:0;height:32px;display:flex;align-items:center;gap:6px;padding:0 9px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-primary)}
.search svg{width:14px;height:14px;color:var(--text-tertiary);flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:12.5px}
.list-scroll{flex:1;min-height:0;overflow:auto}

.item-row{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border-subtle);cursor:pointer;position:relative;transition:background 120ms var(--ease-out)}
.item-row:hover{background:var(--surface-hover)}
.item-row.sel{background:var(--accent-soft)}
.item-row.sel::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:var(--radius-sm);background:var(--accent-fill)}
.thumb{width:72px;height:72px;flex:0 0 auto;border-radius:var(--radius-md);overflow:hidden;background:var(--surface-sunken);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.row-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;justify-content:center}
.row-title{font-size:14px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-page{font-size:12px;font-weight:400;color:var(--text-tertiary);margin-left:7px}
.row-meta{font-size:12px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-snippet{font-size:13px;line-height:1.6;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:1px}
.tag-chip{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:var(--radius-sm);background:var(--surface-secondary);border:1px solid var(--border-subtle);color:var(--text-secondary);font-size:11px;white-space:nowrap}
.tag-chip:hover{border-color:var(--border-default);color:var(--text-primary)}
.list-empty{padding:64px 26px;text-align:center;color:var(--text-tertiary);font-size:13px;line-height:1.8}
.list-empty b{display:block;color:var(--text-secondary);font-size:14px;margin-bottom:4px}
.list-empty .btn{margin-top:14px}

/* detail */
.detail{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--border-subtle);background:var(--surface-primary)}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--text-tertiary);font-size:13px}
.detail-head{padding:18px 20px 14px;border-bottom:1px solid var(--border-subtle);flex:0 0 auto}
.detail-kicker{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-tertiary);margin-bottom:5px}
.detail-title{font-size:17px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.detail-sub{font-size:12.5px;color:var(--text-secondary);margin-top:3px}
.detail-body{flex:1;min-height:0;overflow:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px}
.detail-image{border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;background:var(--surface-sunken);cursor:zoom-in}
.detail-image img{width:100%;max-height:280px;object-fit:contain;display:block}
.detail-section{display:flex;flex-direction:column;gap:6px}
.detail-label{font-size:11px;font-weight:600;color:var(--text-tertiary);letter-spacing:.03em}
.detail-text{font-family:var(--font-reading);font-size:14px;line-height:1.85;color:var(--text-primary);white-space:pre-wrap}
.detail-note{font-size:13px;line-height:1.7;color:var(--text-secondary);white-space:pre-wrap}
.detail-note.empty{color:var(--text-decorative)}
.source-details{border-top:1px solid var(--border-subtle);padding-top:10px}
.source-details summary{list-style:none;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-tertiary);cursor:pointer;width:max-content;border-radius:var(--radius-sm);padding:2px 4px}
.source-details summary::-webkit-details-marker{display:none}
.source-details summary:hover{color:var(--text-primary);background:var(--surface-hover)}
.source-details summary svg{width:12px;height:12px;transition:transform 140ms var(--ease-out)}
.source-details[open] summary svg{transform:rotate(90deg)}
.meta-list{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px 10px;font-size:12px;color:var(--text-secondary);align-items:baseline;margin-top:8px}
.meta-list dt{color:var(--text-tertiary);font-size:11.5px}
.meta-list dd{margin:0;word-break:break-all}
.warn-bar{display:flex;gap:8px;align-items:flex-start;margin:12px 20px 0;padding:9px 11px;border-radius:var(--radius-md);background:var(--warning-soft);color:var(--warning);font-size:12px;line-height:1.6}
.warn-bar svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px}
.detail-actions{flex:0 0 auto;padding:12px 20px 16px;border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-actions .spacer{flex:1}

/* import view */
.import-shell{flex:1;min-height:0;overflow:auto;padding:20px 28px 48px}
.import-inner{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.import-main{min-width:0;display:flex;flex-direction:column;gap:10px}
.dropzone{min-height:380px;border:1.5px dashed var(--border-control);border-radius:var(--radius-lg);background:var(--surface-secondary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:28px;cursor:pointer;text-align:center;transition:border-color 140ms var(--ease-out),background 140ms var(--ease-out)}
.dropzone:hover,.dropzone:focus-visible{border-color:var(--accent-fill);background:var(--accent-soft)}
.dropzone.over{border-color:var(--accent-fill);background:var(--accent-soft);box-shadow:var(--focus-ring)}
.dropzone > svg{width:34px;height:34px;flex:0 0 auto;color:var(--text-tertiary)}
.drop-title{font-size:15px;font-weight:600;color:var(--text-primary)}
.drop-hint{font-size:12px;color:var(--text-tertiary)}
.dropzone .btn{margin-top:6px}
.dropzone.has-image{padding:10px;cursor:default;background:var(--surface-primary);border-style:solid;border-color:var(--border-subtle);min-height:0;align-items:stretch;justify-content:center}
.dropzone.has-image:hover{background:var(--surface-primary);border-color:var(--border-default)}
.preview-img{width:100%;max-height:440px;object-fit:contain;display:block;border-radius:var(--radius-md);background:var(--surface-sunken)}
.preview-meta{display:flex;align-items:flex-start;gap:10px;padding:2px 4px 0;min-width:0}
.preview-meta .file{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.preview-meta .file b{font-size:12.5px;font-weight:600;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-meta .file span{font-size:11.5px;color:var(--text-tertiary)}
.preview-meta .actions{display:flex;gap:2px;flex:0 0 auto}
.import-secondary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 2px 0}
.import-secondary .also{font-size:12px;color:var(--text-tertiary)}
.import-secondary .btn{height:34px;font-size:13px;padding:0 13px}
.import-secondary .hint{font-size:12px;color:var(--text-tertiary)}
.import-form{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--surface-primary);padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.form-source{font-size:12px;line-height:1.6;color:var(--text-tertiary);padding-bottom:12px;border-bottom:1px solid var(--border-subtle);overflow-wrap:anywhere}
.form-source b{color:var(--text-secondary);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .field-label{font-size:11.5px;font-weight:600;color:var(--text-tertiary)}
.field textarea{width:100%;min-height:86px;resize:vertical;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-primary);padding:8px 10px;font-size:13px;line-height:1.6;outline:none}
.field textarea:focus{border-color:var(--accent-fill);box-shadow:var(--focus-ring)}
.tag-checks{max-height:186px;overflow:auto;display:flex;flex-direction:column;gap:1px;margin:0 -4px}
.tag-check{display:flex;align-items:center;gap:8px;min-height:30px;padding:2px 6px;border-radius:var(--radius-sm);font-size:12.5px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;overflow:hidden}
.tag-check:hover{background:var(--surface-hover)}
.tag-check input{width:15px;height:15px;accent-color:var(--accent-fill);flex:0 0 auto}
.tag-check span{overflow:hidden;text-overflow:ellipsis}
.new-tag{display:flex;gap:6px;padding-top:2px}
.new-tag input{flex:1;min-width:0;height:32px;border:1px solid var(--border-default);border-radius:var(--radius-md);padding:0 9px;font-size:12.5px;background:var(--surface-primary);outline:none}
.new-tag input:focus{border-color:var(--accent-fill);box-shadow:var(--focus-ring)}
.save-block{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.save-block .btn{width:100%;height:38px}
.form-hint{min-height:17px;font-size:11.5px;color:var(--text-tertiary);text-align:center;line-height:1.5}
.form-hint.error{color:var(--danger)}

/* reader demo */
.reader-wrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.reader-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 24px;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);background:var(--surface-secondary)}
.reader-toolbar .spacer{flex:1}
.page-chip{font-size:12px;color:var(--text-secondary);background:var(--surface-primary);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:3px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.reader-scroll{flex:1;min-height:0;overflow:auto;padding:26px 24px 60px}
.reader-hint{max-width:720px;margin:0 auto 14px;font-size:12.5px;color:var(--text-tertiary);display:flex;align-items:center;gap:6px}
.reader-hint svg{width:14px;height:14px}
.reader-paper{max-width:720px;margin:0 auto;font-family:var(--font-reading);font-size:15.5px;line-height:2;color:var(--text-primary);background:var(--surface-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:42px 48px}
.reader-paper h2{font-size:20px;margin:0 0 20px;font-weight:700}
.reader-paper p{margin:0 0 16px;text-align:justify}

/* dialog base */

var imageCache={};
function loadImage(src){
  if(!imageCache[src]){
    imageCache[src]=new Promise(function(resolve,reject){
      var img=new Image();img.onload=function(){resolve(img);};img.onerror=reject;img.src=src;
    });
  }
  return imageCache[src];
}
function cropToDataUrl(img,box){
  var canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(box.w));canvas.height=Math.max(1,Math.round(box.h));
  canvas.getContext('2d').drawImage(img,box.x,box.y,box.w,box.h,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/png');
}
function prepareImages(){
  return Promise.all(state.items.filter(function(i){return i.type==='image';}).map(function(item){
    if(item.crop) return Promise.resolve();
    if(item.cropSrc) return loadImage(item.cropSrc).then(function(img){item.crop=item.cropSrc;item.natW=img.naturalWidth;item.natH=img.naturalHeight;});
    return loadImage(item.asset).then(function(img){item.crop=cropToDataUrl(img,item.box);item.natW=img.naturalWidth;item.natH=img.naturalHeight;});
  })).catch(function(){});
}

/* ── filtering ── */
function itemHasTag(item,path){if(!path)return true;return item.tags.some(function(t){return t===path||t.indexOf(path+'/')===0;});}
function itemMatches(item){
  if(!itemHasTag(item,state.activeTag))return false;
  if(state.filter==='image'&&item.type!=='image')return false;
  if(state.filter==='text'&&item.type!=='text')return false;
  if(!state.query)return true;
  var q=state.query.toLowerCase();
  var hay=(item.note||'')+' '+(item.text||'')+' '+(item.book||'')+' '+(item.author||'')+' '+(item.file||'')+' '+item.tags.join(' ');
  return hay.toLowerCase().indexOf(q)>=0;
}
function visibleItems(){return state.items.filter(itemMatches);}
function tagCount(path){return state.items.filter(function(i){return itemHasTag(i,path);}).length;}
function buildTree(paths){var map=new Map();paths.forEach(function(p){var parent=parentPath(p);if(!map.has(parent))map.set(parent,[]);map.get(parent).push(p);});return map;}

function chooseTag(path){state.activeTag=path;state.activeId=null;render();}
function renderTagPane(){
  var pane=el('div','tag-pane');
  var head=el('div','tag-head');
  head.innerHTML='<span>标签</span><button class="icon-btn" type="button" id="new-tag" aria-label="新建标签" title="新建标签">'+icon('plus')+'</button>';
  pane.appendChild(head);
  var list=el('div','tag-list');
  list.id='tag-list';

  var all=el('div','tag-row'+(state.activeTag===''?' active':''));
  all.innerHTML='<span class="tag-toggle-space"></span><button class="tag-label" type="button">全部语料</button><span class="tag-count">'+state.items.length+'</span>';
  all.onclick=function(){chooseTag('');};
  list.appendChild(all);

  var tree=buildTree(state.tags);
  function branch(parent,depth){
    var wrap=el('div');
    (tree.get(parent)||[]).slice().sort(function(a,b){return a.localeCompare(b,'zh-CN');}).forEach(function(path){
      var hasChildren=tree.has(path);
      var row=el('div','tag-row'+(state.activeTag===path?' active':''));
      row.style.paddingLeft=(6+depth*14)+'px';
      if(hasChildren){
        var toggle=el('button','tag-toggle');
        toggle.type='button';
        toggle.setAttribute('aria-expanded',String(state.expanded.has(path)));
        toggle.setAttribute('aria-label',(state.expanded.has(path)?'收起 ':'展开 ')+displayPath(path));
        toggle.innerHTML=icon('chevron');
        toggle.onclick=function(event){event.stopPropagation();if(state.expanded.has(path))state.expanded.delete(path);else state.expanded.add(path);render();};
        row.appendChild(toggle);
      }else{
        row.appendChild(el('span','tag-toggle-space'));
      }
      var label=el('button','tag-label',tagLabel(path));
      label.type='button';label.title=displayPath(path);
      row.appendChild(label);
      row.appendChild(el('span','tag-count',String(tagCount(path))));
      row.onclick=function(){chooseTag(path);};
      wrap.appendChild(row);
      if(hasChildren&&state.expanded.has(path))wrap.appendChild(branch(path,depth+1));
    });
    return wrap;
  }
  list.appendChild(branch('',0));
  pane.appendChild(list);

  head.querySelector('#new-tag').onclick=function(){
    var raw=window.prompt('新建标签（用 / 分隔层级，最多三级）','写作素材');
    if(raw===null)return;
    var parts=splitPath(raw);
    if(!parts.length)return;
    if(parts.length>3||parts.some(function(p){return p.length>30;})){toast('标签最多三级，每级 1–30 个字符');return;}
    var path=parts.join('/');
    if(state.tags.indexOf(path)>=0){toast('这个标签已经存在');return;}
    state.tags.push(path);
    var parent=parentPath(path);if(parent)state.expanded.add(parent);
    render();toast('已创建标签 '+displayPath(path));
  };
  return pane;
}

var tagTarget=null;
function openTagEditor(item){
  tagTarget=item;
  var box=document.getElementById('tag-dialog-checks');box.innerHTML='';
  state.tags.slice().sort(function(a,b){return a.localeCompare(b,'zh-CN');}).forEach(function(path){
    var label=el('label','tag-check');
    var cb=el('input');cb.type='checkbox';cb.value=path;cb.checked=item.tags.indexOf(path)>=0;
    label.appendChild(cb);label.appendChild(el('span',null,displayPath(path)));

function closeTagDialog(){document.getElementById('tag-dialog').hidden=true;tagTarget=null;}
function addTagFromDialog(){
  var input=document.getElementById('tag-dialog-new');
  var parts=splitPath(input.value);
  if(!parts.length)return;
  if(parts.length>3||parts.some(function(p){return p.length>30;})){toast('标签最多三级，每级 1–30 个字符');return;}
  var path=parts.join('/');
  if(state.tags.indexOf(path)<0)state.tags.push(path);
  var box=document.getElementById('tag-dialog-checks');
  var existing=Array.from(box.querySelectorAll('input')).find(function(cb){return cb.value===path;});
  if(existing){existing.checked=true;}else{
    var label=el('label','tag-check');
    var cb=el('input');cb.type='checkbox';cb.value=path;cb.checked=true;
    label.appendChild(cb);label.appendChild(el('span',null,displayPath(path)));
    box.appendChild(label);
  }
  input.value='';
}
function saveTagDialog(){
  if(!tagTarget)return;
  var checked=Array.from(document.querySelectorAll('#tag-dialog-checks input:checked')).map(function(cb){return cb.value;});
  if(!checked.length){toast('至少保留一个标签');return;}
  tagTarget.tags=checked;

function saveImport(){

  if(!imp||!imp.dataUrl){toast('先选择一张图片');return;}
  if(!imp.tags.size){toast('至少选择一个标签');return;}

  if(duplicate){toast('这张图已经在素材库里');return;}
  var tags=Array.from(imp.tags);

  if(imp.source&&imp.source.kind==='pdf'){
    item={id:'i'+Date.now(),type:'image',source:'pdf',book:imp.source.book,author:imp.source.author,
      printed:imp.source.printed,pdfPage:imp.source.pdfPage,asset:imp.source.asset,box:Object.assign({},imp.source.box),
      crop:imp.dataUrl,dims:imp.dims,note:(imp.note||'').trim(),tags:tags,date:today(),fingerprint:'8f3a2c…'};
  }else{
    item={id:'i'+Date.now(),type:'image',source:'local',file:imp.name,cropSrc:imp.dataUrl,dims:imp.dims,
      note:(imp.note||'').trim(),tags:tags,date:today()};

  if(!itemHasTag(item,state.activeTag))state.activeTag='';

/* ── file input / drop / paste ── */
function readAsDataUrl(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();r.onload=function(){resolve(r.result);};r.onerror=reject;r.readAsDataURL(file);
  });
}
function imageFileFrom(files){
  var list=Array.from(files||[]);
  var file=list.find(function(f){return /^image\/(png|jpeg)$/.test(f.type);});
  if(!file){toast('只支持 PNG / JPEG 图片');return null;}
  if(list.length>1)toast('一次先收一张，已放入第一张');
  if(file.size>25*1024*1024){toast('单张图片不超过 25 MB');return null;}
  return file;
}
function applyImageFile(file){
  readAsDataUrl(file).then(function(src){
    return loadImage(src).then(function(img){
      var extra={dataUrl:src,name:file.name,file:file.name,dims:img.naturalWidth+' × '+img.naturalHeight,source:{kind:'local'}};
      if(state.view==='import'&&state.importData){
        Object.assign(state.importData,extra);state.importData.error='';render();
      }else{
        openImport(extra);
      }
    });
  }).catch(function(){toast('读取图片失败');});
}
function handleFiles(files){
  var file=imageFileFrom(files);
  if(file)applyImageFile(file);
}

/* ── capture ── */
var cap={open:false,mode:'capture',bookId:'b1',pageIndex:0,box:null,item:null,preview:null,dragging:false,start:null,pending:null};
function currentBook(){return books.find(function(b){return b.id===cap.bookId;});}
function currentPage(){var b=currentBook();return b?b.pages[cap.pageIndex]:null;}
function openCapture(options){
  options=options||{};
  cap.open=true;cap.mode=options.mode||'capture';cap.item=options.item||null;
  if(cap.mode==='locate'&&cap.item){
    var book=books.find(function(b){return b.title===cap.item.book;})||books[0];
    cap.bookId=book.id;
    var idx=book.pages.findIndex(function(p){return p.printed===cap.item.printed;});
    cap.pageIndex=Math.max(0,idx);
    cap.box=cap.item.box?Object.assign({},cap.item.box):null;
    cap.preview=cap.item.crop||cap.item.cropSrc||null;
  }else{
    cap.bookId=options.bookId||'b1';
    var b=currentBook();
    var target=options.printed?b.pages.findIndex(function(p){return p.printed===options.printed;}):0;
    cap.pageIndex=Math.max(0,target);
    cap.box=null;cap.preview=null;
  }
  document.getElementById('cap-dialog').hidden=false;
  document.getElementById('cap-book-menu').hidden=true;
  renderCapture();
}
function closeCapture(){
  cap.open=false;cap.dragging=false;
  document.getElementById('cap-dialog').hidden=true;
  document.getElementById('cap-book-menu').hidden=true;
}
function renderCapture(){
  if(!cap.open)return;
  var book=currentBook(),page=currentPage();
  if(!book||!page){closeCapture();return;}
  var locate=cap.mode==='locate';
  document.getElementById('cap-title').textContent=locate?'图片出处':'从 PDF 截图';
  document.getElementById('cap-sub').textContent=locate?'这是保存图片时的来源页与原框位置':'在页面上拖出一个框，只保留框内区域';
  document.getElementById('cap-tool-note').textContent=locate?'原框位置 · 只读':'拖动框选';
  document.getElementById('cap-book-label').textContent=book.title;
  var menu=document.getElementById('cap-book-menu');menu.innerHTML='';
  books.forEach(function(b){
    var btn=el('button',b.id===cap.bookId?'on':'',b.title);btn.type='button';
    btn.onclick=function(){cap.bookId=b.id;cap.pageIndex=0;cap.box=null;cap.preview=null;menu.hidden=true;renderCapture();};
    menu.appendChild(btn);
  });
  document.getElementById('cap-page-label').textContent='第 '+page.printed+' 页 · PDF '+page.pdf;
  document.getElementById('cap-prev').disabled=cap.pageIndex<=0;
  document.getElementById('cap-next').disabled=cap.pageIndex>=book.pages.length-1;
  var img=document.getElementById('cap-page-img');
  img.src=page.img;img.alt=book.title+' 第 '+page.printed+' 页';
  document.getElementById('cap-page-wrap').classList.toggle('drawable',!locate);
  var box=document.getElementById('cap-box');
  box.classList.toggle('locate',locate);
  document.getElementById('cap-box-label').textContent=locate?'保存时的原框':'框选区域';
  box.hidden=!cap.box;
  document.getElementById('cap-source').innerHTML='<b>《'+esc(book.title)+'》</b> · 印刷页 '+esc(page.printed)+' · PDF 第 '+esc(page.pdf)+' 页';
  var use=document.getElementById('cap-use');
  use.textContent=locate?'关闭':'使用这张图';
  use.disabled=locate?false:!cap.box;
  document.getElementById('cap-cancel').hidden=locate;
  document.getElementById('cap-hint').textContent=locate
    ? '这是这张图片保存时的来源页和原框。图片与出处会一直保留，原书变动时也不会删除。'
    : '框选后只保存框内区域；说明和标签在下一步填写。';
  if(locate&&cap.preview)setCapPreview(cap.preview);
  else if(!cap.box)clearCapPreview();
  if(cap.box)requestAnimationFrame(function(){drawBoxPixels();if(!locate)updateCapPreview();});
}
function setCapPreview(src){
  if(!src){clearCapPreview();return;}
  document.getElementById('cap-preview').innerHTML='<img src="'+src+'" alt="裁切预览">';
}
function clearCapPreview(){
  document.getElementById('cap-preview').innerHTML='<div class="placeholder">在页面上拖出一个框<br>这里会出现裁切预览</div>';
}
function drawBoxPixels(){
  if(!cap.box||!cap.open)return;
  var wrap=document.getElementById('cap-page-wrap');
  var img=document.getElementById('cap-page-img');
  var rect=img.getBoundingClientRect();
  if(!rect.width||!img.naturalWidth)return;
  var scale=rect.width/img.naturalWidth;
  var box=document.getElementById('cap-box');
  box.hidden=false;
  box.style.left=(cap.box.x*scale)+'px';
  box.style.top=(cap.box.y*scale)+'px';
  box.style.width=(cap.box.w*scale)+'px';
  box.style.height=(cap.box.h*scale)+'px';
}
function updateCapPreview(){
  if(!cap.box){clearCapPreview();return;}
  loadImage(currentPage().img).then(function(img){
    cap.preview=cropToDataUrl(img,cap.box);
    setCapPreview(cap.preview);
    var use=document.getElementById('cap-use');if(use)use.disabled=cap.mode==='locate'?false:!cap.box;
  }).catch(function(){});
}
function beginDraw(event){
  if(cap.mode==='locate')return;
  if(event.button!==undefined&&event.button!==0)return;
  var img=document.getElementById('cap-page-img');
  var rect=img.getBoundingClientRect();
  var x=Math.min(Math.max(event.clientX-rect.left,0),rect.width);
  var y=Math.min(Math.max(event.clientY-rect.top,0),rect.height);
  cap.dragging=true;cap.start={x:x,y:y,rect:rect};cap.box=null;cap.preview=null;
  clearCapPreview();event.preventDefault();
  try{document.getElementById('cap-page-wrap').setPointerCapture(event.pointerId);}catch(_e){}
}
function moveDraw(event){
  if(!cap.dragging||!cap.start)return;
  var s=cap.start;
  var x=Math.min(Math.max(event.clientX-s.rect.left,0),s.rect.width);
  var y=Math.min(Math.max(event.clientY-s.rect.top,0),s.rect.height);
  var left=Math.min(x,s.x),top=Math.min(y,s.y),w=Math.abs(x-s.x),h=Math.abs(y-s.y);
  var img=document.getElementById('cap-page-img');
  var scale=img.naturalWidth/s.rect.width;
  var box=document.getElementById('cap-box');
  box.hidden=false;box.classList.remove('locate');
  box.style.left=left+'px';box.style.top=top+'px';box.style.width=w+'px';box.style.height=h+'px';
  cap.pending={x:left*scale,y:top*scale,w:w*scale,h:h*scale};
}
function endDraw(){
  if(!cap.dragging)return;
  cap.dragging=false;
  if(!cap.pending||cap.pending.w<8||cap.pending.h<8){
    cap.pending=null;cap.box=null;document.getElementById('cap-box').hidden=true;
    var use=document.getElementById('cap-use');if(use)use.disabled=cap.mode==='locate'?false:true;
    return;
  }
  var img=document.getElementById('cap-page-img');
  var box=cap.pending;
  box.x=Math.max(0,Math.min(box.x,img.naturalWidth-1));
  box.y=Math.max(0,Math.min(box.y,img.naturalHeight-1));
  box.w=Math.min(box.w,img.naturalWidth-box.x);
  box.h=Math.min(box.h,img.naturalHeight-box.y);
  cap.box=box;cap.pending=null;
  drawBoxPixels();updateCapPreview();
  var use=document.getElementById('cap-use');if(use)use.disabled=false;
}
function useCapture(){
  if(cap.mode==='locate'){closeCapture();return;}
  if(!cap.box)return;
  var book=currentBook(),page=currentPage();
  var img=document.getElementById('cap-page-img');
  var dataUrl=cap.preview||cropToDataUrl(img,cap.box);
  var capture={dataUrl:dataUrl,name:book.title+' 第 '+page.printed+' 页.png',file:'',
    dims:Math.round(cap.box.w)+' × '+Math.round(cap.box.h),
    source:{kind:'pdf',book:book.title,author:book.author,printed:page.printed,pdfPage:page.pdf,asset:page.img,box:Object.assign({},cap.box)}};
  closeCapture();
  if(state.view==='import'&&state.importData){
    Object.assign(state.importData,capture);state.importData.error='';render();
  }else{
    openImport(capture);
  }
}

/* drop */
var dragDepth=0;
function isFileDrag(event){return event.dataTransfer&&Array.from(event.dataTransfer.types).indexOf('Files')>=0;}
window.addEventListener('dragenter',function(event){
  if(!isFileDrag(event)||cap.open||!document.getElementById('lightbox').hidden)return;
  dragDepth++;document.getElementById('drop-overlay').hidden=false;
});
window.addEventListener('dragover',function(event){if(isFileDrag(event))event.preventDefault();});
window.addEventListener('dragleave',function(event){
  if(!isFileDrag(event))return;
  dragDepth=Math.max(0,dragDepth-1);
  if(dragDepth===0)document.getElementById('drop-overlay').hidden=true;
});
window.addEventListener('drop',function(event){
  if(!isFileDrag(event))return;
  event.preventDefault();dragDepth=0;document.getElementById('drop-overlay').hidden=true;
  if(cap.open)return;
  handleFiles(event.dataTransfer.files);
});
/* paste */
document.addEventListener('paste',function(event){
  if(cap.open)return;
  var target=event.target;
  if(target&&/^(INPUT|TEXTAREA)$/.test(target.tagName))return;
  var files=Array.from(event.clipboardData&&event.clipboardData.files||[]);
  if(!files.length)return;
  event.preventDefault();
  handleFiles(files);
});

/* capture wiring */
document.getElementById('cap-close').onclick=closeCapture;
document.getElementById('cap-cancel').onclick=closeCapture;
document.getElementById('cap-use').onclick=useCapture;
document.getElementById('cap-book-btn').onclick=function(event){
  event.stopPropagation();
  var menu=document.getElementById('cap-book-menu');
  menu.hidden=!menu.hidden;
  this.setAttribute('aria-expanded',String(!menu.hidden));
};
document.addEventListener('click',function(event){
  if(!event.target.closest('.cap-select')){var menu=document.getElementById('cap-book-menu');if(menu)menu.hidden=true;}
});
document.getElementById('cap-prev').onclick=function(){if(cap.pageIndex>0){cap.pageIndex--;cap.box=null;cap.preview=null;renderCapture();}};
document.getElementById('cap-next').onclick=function(){var b=currentBook();if(cap.pageIndex<b.pages.length-1){cap.pageIndex++;cap.box=null;cap.preview=null;renderCapture();}else toast('样稿只载入了这两页');};
document.getElementById('cap-page-wrap').addEventListener('pointerdown',beginDraw);
document.getElementById('cap-page-wrap').addEventListener('pointermove',moveDraw);
document.getElementById('cap-page-wrap').addEventListener('pointerup',endDraw);
document.getElementById('cap-page-wrap').addEventListener('pointercancel',endDraw);
document.getElementById('cap-page-img').addEventListener('load',function(){if(cap.open&&cap.box)drawBoxPixels();});
window.addEventListener('resize',function(){if(cap.open&&cap.box)drawBoxPixels();});

/* tag dialog wiring */
document.getElementById('tag-close').onclick=closeTagDialog;
document.getElementById('tag-dialog-cancel').onclick=closeTagDialog;
document.getElementById('tag-dialog-save').onclick=saveTagDialog;
document.getElementById('tag-dialog-add').onclick=addTagFromDialog;
document.getElementById('tag-dialog-new').onkeydown=function(event){if(event.key==='Enter'){event.preventDefault();addTagFromDialog();}};
document.getElementById('tag-dialog').onclick=function(event){if(event.target===this)closeTagDialog();};

/* lightbox */
document.getElementById('lightbox-close').onclick=closeLightbox;
document.getElementById('lightbox').onclick=function(event){if(event.target===this)closeLightbox();};

/* keyboard */
document.addEventListener('keydown',function(event){
  if(event.key!=='Escape')return;
  if(!document.getElementById('lightbox').hidden){closeLightbox();return;}
  if(!document.getElementById('tag-dialog').hidden){closeTagDialog();return;}
  if(cap.open){closeCapture();return;}
});

/* boot */
prepareImages().then(function(){render();});
})();
</script>
</body>
</html>
