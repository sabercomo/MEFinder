name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/update_site_release.py"
      - ".github/workflows/deploy-site.yml"
  # Publishing or editing a GitHub release refreshes the download links.
  release:
    types: [published, edited]
  # Safety net: pick up a release whose event did not trigger a run.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The github-pages environment only accepts main, and a release event runs on
  # its tag — so hand the release over to a fresh run on main instead.
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --ref main -R "$GITHUB_REPOSITORY"
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fill release.js from the latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_site_release.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
