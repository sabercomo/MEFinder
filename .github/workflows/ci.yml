name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The release gate: run the entire tests/ tree the same way the build
    # scripts do.  numpy / PyMuPDF / mcp are production dependencies that the
    # suite imports at collection time, so they must be installed for the run
    # to be real — a bare interpreter dies with ModuleNotFoundError before any
    # test executes.  Tests needing the private corpus or a genuinely optional
    # dep (node) still skipUnless-skip visibly.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "numpy>=1.26" "PyMuPDF==1.26.5" "mcp==2.0.0" "opencc-python-reimplemented==0.1.7"
      - name: Run the whole test suite
        run: python -m unittest discover -t . -s tests
      - name: Verify cold backend without alignment compute dependencies
        run: |
          python -m venv .core-test-venv
          .core-test-venv/bin/python -m unittest tests.test_core_without_alignment
      - name: Verify fallback without OpenCC
        run: |
          python -m pip uninstall -y opencc-python-reimplemented
          python -m unittest tests.test_script_conversion tests.test_script_search

  windows-tests:
    # Runtime maintenance uses Windows file locks as well as POSIX leases.
    # Exercise both platforms on pushes; release smoke still owns packaging.
    runs-on: windows-2022
    # The suite normally takes ~800s here but a slow runner pushed it past the
    # old 1000s dump deadline mid-run (run 36537244376, tests still passing).
    # Keep the dump below the job timeout so a genuine stall still logs stacks.
    timeout-minutes: 30
    env:
      # Match the documented Windows gate; fixtures contain Chinese text.
      PYTHONUTF8: "1"
      MEFINDER_FAULTHANDLER_SECONDS: "1600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install test dependencies
        run: python -m pip install "numpy>=1.26" "PyMuPDF==1.26.5" "mcp==2.0.0" "opencc-python-reimplemented==0.1.7"
      - name: Run the whole test suite on Windows
        # Diagnostic (temporary): the Windows gate has stalled for the full
        # timeout without unittest revealing which case hangs. This runner
        # streams each test name and dumps all thread stacks before the CI
        # hard kill, so a stall is localized in the log. It observes only —
        # no test is skipped and no lock semantics change. Revert to the plain
        # `python -m unittest discover -t . -s tests` once the stall is fixed.
        run: python scripts/run_tests_with_faulthandler.py discover -t . -s tests
      - name: Verify fallback without OpenCC
        run: |
          python -m pip uninstall -y opencc-python-reimplemented
          python -m unittest tests.test_script_conversion tests.test_script_search

  browser-regression:
    # Trial job: real Chrome against the real backend on a disposable DB
    # (tests/test_browser_regression.py). Non-blocking until it has proven
    # stable across runs; see docs/issues/architecture-followup-2026-09.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    env:
      MEFINDER_BROWSER_TESTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "numpy>=1.26" "PyMuPDF==1.26.5" "mcp==2.0.0" "opencc-python-reimplemented==0.1.7" -r requirements-browser-tests.txt
      - name: Run real-browser regressions
        run: python -m unittest -v tests.test_browser_regression

  lint:
    # Ruff pyflakes ("F") rules are at zero and block regressions.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (pyflakes)
        run: pipx run ruff check .
